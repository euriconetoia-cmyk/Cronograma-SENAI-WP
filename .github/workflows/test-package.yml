name: Test package
on:
  push:
    branches:
      - release/2.20.0-rc1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.17.1 --activate
      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --no-frozen-lockfile
      - name: Build WordPress frontend
        working-directory: ui
        run: pnpm build:wp
      - name: Install generated WordPress bundle
        run: cp ui/dist-wp/app.js plugin-cronograma-ead-core/assets/app.js
      - name: PHP syntax check
        run: bash tests/php-syntax.sh
      - name: Calendar contracts
        run: |
          php tests/unit-rules.php
          node tests/calendar-contract.mjs
      - name: Catalog contract
        run: php tests/catalog-contract.php
      - name: Schedule profiles
        run: node --experimental-strip-types --experimental-specifier-resolution=node tests/schedule-profiles.mjs
      - name: Multimodel schedule engine
        run: node --experimental-strip-types --experimental-specifier-resolution=node tests/schedule-multimodel.mjs
      - name: Four official schedule models
        run: node --experimental-strip-types --experimental-specifier-resolution=node tests/modelos-cronograma.mjs
      - name: Static security checks
        run: node tests/security-static.mjs
      - name: Validate generated bundle
        run: |
          test -s plugin-cronograma-ead-core/assets/app.js
          grep -q "2.20.0" plugin-cronograma-ead-core/cronograma-ead-core.php
      - name: Build WordPress test ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test-dist
          mkdir -p test-dist/plugin test-dist/theme
          cp -R plugin-cronograma-ead-core test-dist/plugin/cronograma-ead-core
          cp -R theme-cronograma-ead-theme test-dist/theme/cronograma-ead-theme
          rm -rf test-dist/plugin/cronograma-ead-core/.parcel-cache
          (cd test-dist/plugin && zip -qr ../cronograma-ead-core-2.20.0-rc1-TESTE.zip cronograma-ead-core)
          (cd test-dist/theme && zip -qr ../cronograma-ead-theme-2.20.0-rc1-TESTE.zip cronograma-ead-theme)
          unzip -t test-dist/cronograma-ead-core-2.20.0-rc1-TESTE.zip
          unzip -t test-dist/cronograma-ead-theme-2.20.0-rc1-TESTE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cronograma-ead-2.20.0-rc1-TESTE
          path: |
            test-dist/*.zip
            plugin-cronograma-ead-core/assets/app.js
