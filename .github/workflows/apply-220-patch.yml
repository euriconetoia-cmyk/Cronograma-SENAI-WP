name: Apply 2.20 patch
on:
  push:
    branches:
      - release/2.20.0-rc1
    paths:
      - '.bootstrap/part-*'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply multimodel patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/part-01 || { echo "Waiting for final patch chunk"; exit 0; }
          cat .bootstrap/part-00 .bootstrap/part-01 | base64 -d | gzip -d > /tmp/2.20.patch
          git apply --exclude=.github/workflows/ci.yml /tmp/2.20.patch
          test -f ui/src/lib/scheduleProfiles.ts
          test -f tests/modelos-cronograma.mjs
          grep -q "2.20.0" plugin-cronograma-ead-core/cronograma-ead-core.php
          git diff --check
          rm -rf .bootstrap
          rm -f .github/workflows/apply-220-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Schedule Engine 2.0 multimodelo"
          git push origin HEAD:release/2.20.0-rc1
