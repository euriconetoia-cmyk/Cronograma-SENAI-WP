name: Bootstrap release source
on:
  push:
    branches:
      - release/2.19.0-rc1
    paths:
      - '.bootstrap/**'
permissions:
  contents: write
jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.tar.gz.b64 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          cp .github/workflows/bootstrap-source.yml /tmp/bootstrap-source.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/source.tar.gz -C .
          rm -rf .github
          mkdir -p .github/workflows
          cp /tmp/bootstrap-source.yml .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Cronograma EaD 2.19.0 RC1 source"
          git push origin HEAD:release/2.19.0-rc1
