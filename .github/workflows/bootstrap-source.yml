name: Bootstrap 2.20.0 RC1 source
on:
  push:
    branches:
      - release/2.20.0-rc1-multimodelo
    paths:
      - '.bootstrap/**'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/part-07 || { echo "Waiting for all parts"; exit 0; }
          cat .bootstrap/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          mkdir -p /tmp/src
          tar -xzf /tmp/source.tar.gz -C /tmp/src
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/src/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Cronograma EaD 2.20.0 RC1 multimodelo"
          git push origin HEAD:release/2.20.0-rc1-multimodelo
