services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:-cronograma}
      MARIADB_USER: ${WP_DB_USER:-cronograma}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-cronograma_local}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-root_local}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8099}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-cronograma}
      WORDPRESS_DB_USER: ${WP_DB_USER:-cronograma}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-cronograma_local}
      WORDPRESS_DEBUG: "0"
    volumes:
      - wp_data:/var/www/html
      - ./plugin-cronograma-ead-core:/var/www/html/wp-content/plugins/cronograma-ead-core
      - ./theme-cronograma-ead-theme:/var/www/html/wp-content/themes/cronograma-ead-theme

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-cronograma}
      WORDPRESS_DB_USER: ${WP_DB_USER:-cronograma}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-cronograma_local}
    volumes:
      - wp_data:/var/www/html
      - ./plugin-cronograma-ead-core:/var/www/html/wp-content/plugins/cronograma-ead-core
      - ./theme-cronograma-ead-theme:/var/www/html/wp-content/themes/cronograma-ead-theme
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
